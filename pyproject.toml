[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsha"
version = "2.0.0"
description = "DFSha - sistema de archivos distribuido (Proyecto 1, Sistemas Distribuidos UPB 2026-2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "grpcio==1.85.1",
  "protobuf==7.36.1",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "PyJWT==2.15.0",
  "cryptography==50.0.1",
  "bcrypt==5.0.0",
  "pika==1.4.4",
]

[project.optional-dependencies]
dev = ["grpcio-tools==1.85.1", "pytest"]

[project.scripts]
dfs = "dfsha.client.cli:main"
dfsha-meta = "dfsha.metadata.main:main"
dfsha-datanode = "dfsha.datanode.main:main"
dfsha-gateway = "dfsha.gateway.main:main"
dfsha-auth = "dfsha.auth.main:main"
dfsha-worker = "dfsha.worker.main:main"
dfsha-admin = "dfsha.auth.admin:main"

[tool.setuptools.packages.find]
where = ["src"]
